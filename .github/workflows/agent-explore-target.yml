name: Agent Explore Target
on:
  workflow_call:
    inputs:
      upstream_repository:
        type: string
        default: ""
      target_ref:
        type: string
        default: main
      tool_ref:
        type: string
        required: true
      dry_run:
        type: boolean
        default: true
concurrency:
  group: agent-explore-batch
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only: the agent runs in this job, so nothing here can write to GitHub.
    permissions:
      contents: read
      issues: read
    outputs:
      count: ${{ steps.batch.outputs.count }}

    defaults:
      run:
        working-directory: sandcastle-tool
    steps:
      # Never read issue titles or bodies into shell or `${{ }}` — they are
      # untrusted. They go to a JSON file and only the TS scripts read them.
      - name: List batch
        id: batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BATCH_DIR: ${{ runner.temp }}/batch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sleep 5
          mkdir -p "$BATCH_DIR"
          gh issue list \
            --state open \
            --label "agent:explore" \
            --limit 1000 \
            --json number,title,body,author,createdAt,url,comments \
            > "$BATCH_DIR/issues.json"
          count=$(jq 'length' "$BATCH_DIR/issues.json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Batch: $(jq -r '[.[].number | "#\(.)"] | join(", ")' "$BATCH_DIR/issues.json")"

      # Uploaded before the agent runs, so the apply job validates the plan
      # against a batch the agent could not have tampered with.
      - name: Upload batch
        if: steps.batch.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: explore-batch
          path: ${{ runner.temp }}/batch/issues.json

      - name: Resolve latest upstream revision
        if: steps.batch.outputs.count != '0'
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository || github.repository }}
          TARGET_REF: ${{ inputs.target_ref }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$UPSTREAM_REPOSITORY/commits/$TARGET_REF" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned upstream revision: $sha"

      - name: Checkout pinned target
        if: steps.batch.outputs.count != '0'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.upstream.outputs.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Sandcastle
        if: steps.batch.outputs.count != '0'
        uses: actions/checkout@v4
        with:
          repository: xfocus3/sandcastle
          ref: ${{ inputs.tool_ref }}
          path: sandcastle-tool
          persist-credentials: false

      - name: Setup Node.js
        if: steps.batch.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.batch.outputs.count != '0'
        run: npm ci

      - name: Build
        if: steps.batch.outputs.count != '0'
        run: npm run build

      # dot uses the standard artifact identity; no external model credentials.
      - name: Run explore agent
        if: steps.batch.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES_FILE: ${{ runner.temp }}/batch/issues.json
          OUTPUT_DIR: ${{ runner.temp }}/out
        uses: actions/github-script@v7
        with:
          script: |
            const { spawn } = require('node:child_process');
            await new Promise((resolve, reject) => {
              const child = spawn(process.execPath, ['../sandcastle-tool/node_modules/tsx/dist/cli.mjs', '../sandcastle-tool/scripts/dot/stage.ts', '.sandcastle/agent-workflows/explore/explore.ts'], { cwd: process.env.GITHUB_WORKSPACE + '/target', stdio: 'inherit', env: process.env });
              child.on('error', reject);
              child.on('close', code => code === 0 ? resolve() : reject(new Error('Agent stage exited with code ' + code)));
            });

      - name: Upload plan
        if: steps.batch.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: explore-plan
          path: ${{ runner.temp }}/out/

  apply:
    needs: explore
    if: needs.explore.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Sandcastle
        uses: actions/checkout@v4
        with:
          repository: xfocus3/sandcastle
          ref: ${{ inputs.tool_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download batch
        uses: actions/download-artifact@v4
        with:
          name: explore-batch
          path: ${{ runner.temp }}/batch

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: explore-plan
          path: ${{ runner.temp }}/out

      # Validates the whole plan first; on any problem it changes nothing and
      # fails, leaving every agent:explore label in place for the next run.
      - name: Apply plan
        env:
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          BATCH_FILE: ${{ runner.temp }}/batch/issues.json
          PLAN_FILE: ${{ runner.temp }}/out/plan.json
          OUTPUT_DIR: ${{ runner.temp }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npx tsx .sandcastle/agent-workflows/explore/apply.ts

      # The run summary isn't readable through the API; this artifact is.
      - name: Upload dry-run effects
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: explore-dry-run
          path: ${{ runner.temp }}/effects.json
