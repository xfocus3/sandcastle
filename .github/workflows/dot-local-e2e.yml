name: Dot local-template handoff
on:
  push:
    branches: [sandcastle/dot-local-e2e/**]
permissions:
  contents: read
  actions: read
jobs:
  blank:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Build the original Docker sandbox
        run: node dist/main.js docker build-image
      - name: Prepare controlled blank-template task
        run: |
          git config user.name 'sandcastle-fixture[bot]'
          git config user.email 'sandcastle-fixture[bot]@users.noreply.github.com'
          cat > .sandcastle/prompt.md <<'TASK'
          # Context
          Controlled read-only test of the original blank template and Docker sandbox.
          # Task
          Read test-fixtures/dot-java/maven/src/main/java/example/Basket.java and its test.
          Explain whether repeated additions accumulate, citing the actual source.
          Do not modify files or run commands locally. No issue, PR, label, or merge actions.
          # Done
          Output <promise>COMPLETE</promise> after the source-based assessment.
          TASK
      - name: Run the unchanged blank-template entrypoint
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          script: |
            const { spawn } = require('node:child_process');
            await new Promise((resolve, reject) => {
              const child = spawn('npx', ['tsx', 'src/templates/blank/main.mts'], {stdio:'inherit',env:process.env});
              child.on('error', reject);
              child.on('close', code => code === 0 ? resolve() : reject(new Error('Blank template failed: '+code)));
            });
