name: Implement private issue
on:
  workflow_call:
    inputs:
      allow_public_workspace:
        type: boolean
        default: false
      upstream_repository:
        type: string
        required: true
    secrets:
      upstream_sync_token:
        required: true
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  queue:
    if: (github.event_name == 'issues' && github.event.label.name == 'agent:implement') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.queue.outputs.issues }}
      count: ${{ steps.queue.outputs.count }}
    steps:
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          for label in agent:explore agent:implement agent:in-progress agent:blocked agent:review agent:update-branch; do
            gh label create "$label" --color ededed --force
          done
          issues=$(gh issue list --state open --label agent:implement --limit 100 --json number,title)
          if [ "$EVENT_NAME" = issues ]; then
            issues=$(jq --argjson n "$ISSUE_NUMBER" '[.[] | select(.number == $n)]' <<< "$issues")
          fi
          echo "issues=$(jq -c . <<< "$issues")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<< "$issues")" >> "$GITHUB_OUTPUT"
  sync:
    needs: queue
    if: needs.queue.outputs.count != '0'
    uses: xfocus3/sandcastle/.github/workflows/sync-upstream.yml@80f457b2b99f5b417d15425c97a953eba87e4ee8
    secrets:
      upstream_sync_token: ${{ secrets.upstream_sync_token }}
    with:
      upstream_repository: ${{ inputs.upstream_repository }}
      allow_public_workspace: ${{ inputs.allow_public_workspace }}
      upstream_branch: main
      baseline_branch: upstream-main
  implement:
    needs: [queue, sync]
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.queue.outputs.issues) }}
    uses: xfocus3/sandcastle/.github/workflows/agent-implement-target.yml@5b1ec8bb09169218c49e1b57bb86e4a6f78700a7
    with:
      issue_number: ${{ matrix.issue.number }}
      issue_title: ${{ matrix.issue.title }}
      base_sha: ${{ needs.sync.outputs.sha }}
      base_ref: upstream-main
      tool_ref: 27aa174336534dd3c0d41a1765a03e2c072ddc5c
