name: Java target check
on:
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
      patch_ref:
        type: string
        default: ''
      patch_path:
        type: string
        default: ''
      setup_script:
        type: string
        default: ''
      database:
        type: string
        default: ''
      java_version:
        type: string
        default: '25'
      build_tool:
        type: string
        default: gradle
      arguments:
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.patch_ref != ''
        with:
          ref: ${{ inputs.patch_ref }}
          path: request
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify exact source and apply optional patch
        working-directory: target
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          PATCH_REF: ${{ inputs.patch_ref }}
          PATCH_PATH: ${{ inputs.patch_path }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          if [ -n "$PATCH_REF" ] || [ -n "$PATCH_PATH" ]; then
            [[ "$PATCH_REF" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PATCH_PATH" =~ ^patches/[A-Za-z0-9._/-]+\.patch$ ]]
            [[ "$PATCH_PATH" != *..* ]]
            git apply --check "../request/$PATCH_PATH"
            git apply --index "../request/$PATCH_PATH"
          fi
          printf 'base=%s\npatch_commit=%s\ntree=%s\n' "$TARGET_SHA" "$PATCH_REF" "$(git write-tree)" > ../verification.txt
      - name: Prepare project test services
        if: inputs.setup_script != ''
        working-directory: target
        env:
          SETUP_SCRIPT: ${{ inputs.setup_script }}
          RDBMS: ${{ inputs.database }}
        run: |
          set -euo pipefail
          [[ "$SETUP_SCRIPT" =~ ^[A-Za-z0-9_./-]+\.sh$ ]]
          [[ "$SETUP_SCRIPT" != /* && "$SETUP_SCRIPT" != *..* ]]
          test -f "$SETUP_SCRIPT"
          bash "$SETUP_SCRIPT"
      - name: Run Java checks
        working-directory: target
        env:
          BUILD_TOOL: ${{ inputs.build_tool }}
          ARGUMENTS: ${{ inputs.arguments }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          args = json.loads(os.environ["ARGUMENTS"])
          if not isinstance(args, list) or not args or not all(isinstance(x, str) and "\n" not in x for x in args):
              raise ValueError("Check arguments must be a nonempty JSON string array")
          tool = os.environ["BUILD_TOOL"]
          if tool == "gradle":
              command = ["./gradlew", "--no-daemon"]
          elif tool == "maven":
              command = ["./mvnw", "-B"]
          else:
              raise ValueError("Unsupported Java build tool")
          sys.exit(subprocess.run(command + args).returncode)
          PY
      - name: Capture tested source after formatter hooks
        if: always()
        working-directory: target
        env:
          PATCH_REF: ${{ inputs.patch_ref }}
        run: |
          set -euo pipefail
          git diff --binary HEAD > ../verified.patch
          git add -u
          printf 'tested_tree=%s\n' "$(git write-tree)" >> ../verification.txt
          if [ -z "$PATCH_REF" ]; then git diff --exit-code HEAD; fi
      - name: Save exact-revision verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-verification-${{ github.run_id }}
          path: |
            verification.txt
            verified.patch
            target/**/build/test-results/**/TEST-*.xml
            target/**/target/test-results/**/TEST-*.xml
            target/**/target/surefire-reports/TEST-*.xml
            target/**/target/failsafe-reports/TEST-*.xml
          retention-days: 7
          if-no-files-found: error
