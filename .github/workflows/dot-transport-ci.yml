name: Dot transport CI

on:
  push:
    branches: [feat/java-agent-workflows]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Validate external target workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= .github/workflows/*-target.yml .github/workflows/sync-upstream.yml
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
