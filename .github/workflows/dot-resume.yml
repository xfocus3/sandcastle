name: Dot stage recovery

on:
  push:
    branches: [sandcastle/dot-resume/**]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dot-recovery
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure disposable recovery identity
        run: |
          git config user.name 'sandcastle-fixture[bot]'
          git config user.email 'sandcastle-fixture[bot]@users.noreply.github.com'
      - run: npm ci
      - run: npm run build
      - name: Reconcile, restore and resume original stage
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTPUT_DIR: ${{ runner.temp }}/dot-stage-output
        with:
          script: |
            const { spawn } = require('node:child_process');
            await new Promise((resolve, reject) => {
              const child = spawn('npx', ['tsx', 'scripts/dot/stage.ts', '--resume', '.sandcastle/recovery/resume.json'], { stdio: 'inherit', env: process.env });
              child.on('error', reject);
              child.on('close', code => code === 0 ? resolve() : reject(new Error('Recovery stage exited with code ' + code)));
            });
      - name: Save resumed stage outputs for coordinator reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dot-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dot-stage-output
            .sandcastle/dot/stage/status.json
            .sandcastle/dot/journal.json
          if-no-files-found: error
