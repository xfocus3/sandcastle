name: Agent PR Queue
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      verification_workflows:
        type: string
        default: '[]'
      pr_number:
        type: number
        default: 0
permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: write
jobs:
  queue:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.queue.outputs.prs }}
      count: ${{ steps.queue.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xfocus3/sandcastle
          ref: 9b05da2a475bd363723d7c9882cabe2b2ab19341
          path: sandcastle-queue
          persist-credentials: false
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFICATION_WORKFLOWS: ${{ inputs.verification_workflows }}
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$MODE" in
            review|update-branch) label="agent:$MODE" ;;
            implement-pr) label=agent:implement ;;
            *) exit 1 ;;
          esac
          prs=$(gh pr list --state open --label "$label" --limit 100 --json number,headRefName,headRefOid,baseRefName,isCrossRepository)
          prs=$(jq --argjson n "$PR_NUMBER" '[.[] | select(.isCrossRepository == false and ($n == 0 or .number == $n))]' <<< "$prs")
          if [ "$MODE" = review ]; then
            eligible='[]'
            while IFS= read -r pr; do
              head=$(jq -r .headRefOid <<< "$pr")
              if node sandcastle-queue/scripts/dot/verification.mjs "$head" "$VERIFICATION_WORKFLOWS"; then
                eligible=$(jq --argjson pr "$pr" '. + [$pr]' <<< "$eligible")
              fi
            done < <(jq -c '.[]' <<< "$prs")
            prs=$eligible
          fi
          echo "prs=$(jq -c . <<< "$prs")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<< "$prs")" >> "$GITHUB_OUTPUT"
  review:
    needs: queue
    if: needs.queue.outputs.count != '0' && inputs.mode == 'review'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.queue.outputs.prs) }}
    uses: xfocus3/sandcastle/.github/workflows/agent-review-target.yml@9b05da2a475bd363723d7c9882cabe2b2ab19341
    with:
      verification_workflows: ${{ inputs.verification_workflows }}
      pr_number: ${{ matrix.pr.number }}
      branch: ${{ matrix.pr.headRefName }}
      head_sha: ${{ matrix.pr.headRefOid }}
      base_ref: ${{ matrix.pr.baseRefName }}
      tool_ref: 9b05da2a475bd363723d7c9882cabe2b2ab19341
  implement-pr:
    needs: queue
    if: needs.queue.outputs.count != '0' && inputs.mode == 'implement-pr'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.queue.outputs.prs) }}
    uses: xfocus3/sandcastle/.github/workflows/agent-implement-pr-target.yml@9b05da2a475bd363723d7c9882cabe2b2ab19341
    with:
      pr_number: ${{ matrix.pr.number }}
      branch: ${{ matrix.pr.headRefName }}
      head_sha: ${{ matrix.pr.headRefOid }}
      base_ref: ${{ matrix.pr.baseRefName }}
      tool_ref: 9b05da2a475bd363723d7c9882cabe2b2ab19341
  update-branch:
    needs: queue
    if: needs.queue.outputs.count != '0' && inputs.mode == 'update-branch'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.queue.outputs.prs) }}
    uses: xfocus3/sandcastle/.github/workflows/agent-update-branch-target.yml@9b05da2a475bd363723d7c9882cabe2b2ab19341
    with:
      pr_number: ${{ matrix.pr.number }}
      branch: ${{ matrix.pr.headRefName }}
      head_sha: ${{ matrix.pr.headRefOid }}
      base_ref: ${{ matrix.pr.baseRefName }}
      tool_ref: 9b05da2a475bd363723d7c9882cabe2b2ab19341
