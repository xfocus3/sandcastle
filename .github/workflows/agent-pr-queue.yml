name: Agent PR Queue
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      verification_workflows:
        type: string
        default: '[]'
      review_exception:
        type: string
        default: 'null'
      pr_number:
        type: number
        default: 0
permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: write
jobs:
  queue:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.queue.outputs.prs }}
      count: ${{ steps.queue.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xfocus3/sandcastle
          ref: 6759d3bcdb80b00905be3f9db8c102a8adfbd394
          path: sandcastle-queue
          persist-credentials: false
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVIEW_EXCEPTION: ${{ inputs.review_exception }}
          VERIFICATION_WORKFLOWS: ${{ inputs.verification_workflows }}
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$MODE" in
            review|update-branch) label="agent:$MODE" ;;
            implement-pr) label=agent:implement ;;
            *) exit 1 ;;
          esac
          prs=$(gh pr list --state open --label "$label" --limit 100 --json number,headRefName,headRefOid,baseRefName,isCrossRepository)
          prs=$(jq --argjson n "$PR_NUMBER" '[.[] | select(.isCrossRepository == false and ($n == 0 or .number == $n))]' <<< "$prs")
          if [ "$MODE" = review ]; then
            eligible='[]'
            while IFS= read -r pr; do
              head=$(jq -r .headRefOid <<< "$pr")
              number=$(jq -r .number <<< "$pr")
              exception=$(jq -c --argjson number "$number" 'if .pr_number == $number then . else null end' <<< "$REVIEW_EXCEPTION")
              if PR_NUMBER="$number" node sandcastle-queue/scripts/dot/verification.mjs "$head" "$VERIFICATION_WORKFLOWS" "$exception"; then
                eligible=$(jq --argjson pr "$pr" --argjson exception "$exception" '. + [$pr + {reviewException: $exception}]' <<< "$eligible")
              else
                echo "PR #$number: review waiting on verification for $head. Inspect the configured workflow runs." >> "$GITHUB_STEP_SUMMARY"
              fi
            done < <(jq -c '.[]' <<< "$prs")
            prs=$eligible
          fi
          echo "prs=$(jq -c . <<< "$prs")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length <<< "$prs")" >> "$GITHUB_OUTPUT"
  review:
    needs: queue
    if: needs.queue.outputs.count != '0' && inputs.mode == 'review'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.queue.outputs.prs) }}
    uses: xfocus3/sandcastle/.github/workflows/agent-review-target.yml@6759d3bcdb80b00905be3f9db8c102a8adfbd394
    with:
      verification_workflows: ${{ inputs.verification_workflows }}
      review_exception: ${{ toJSON(matrix.pr.reviewException) }}
      pr_number: ${{ matrix.pr.number }}
      branch: ${{ matrix.pr.headRefName }}
      head_sha: ${{ matrix.pr.headRefOid }}
      base_ref: ${{ matrix.pr.baseRefName }}
      tool_ref: 6759d3bcdb80b00905be3f9db8c102a8adfbd394
  implement-pr:
    needs: queue
    if: needs.queue.outputs.count != '0' && inputs.mode == 'implement-pr'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.queue.outputs.prs) }}
    uses: xfocus3/sandcastle/.github/workflows/agent-implement-pr-target.yml@6759d3bcdb80b00905be3f9db8c102a8adfbd394
    with:
      pr_number: ${{ matrix.pr.number }}
      branch: ${{ matrix.pr.headRefName }}
      head_sha: ${{ matrix.pr.headRefOid }}
      base_ref: ${{ matrix.pr.baseRefName }}
      tool_ref: 6759d3bcdb80b00905be3f9db8c102a8adfbd394
  update-branch:
    needs: queue
    if: needs.queue.outputs.count != '0' && inputs.mode == 'update-branch'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.queue.outputs.prs) }}
    uses: xfocus3/sandcastle/.github/workflows/agent-update-branch-target.yml@6759d3bcdb80b00905be3f9db8c102a8adfbd394
    with:
      pr_number: ${{ matrix.pr.number }}
      branch: ${{ matrix.pr.headRefName }}
      head_sha: ${{ matrix.pr.headRefOid }}
      base_ref: ${{ matrix.pr.baseRefName }}
      tool_ref: 6759d3bcdb80b00905be3f9db8c102a8adfbd394
