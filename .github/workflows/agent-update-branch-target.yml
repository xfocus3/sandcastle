name: Agent update-branch Target
on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
      branch:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      base_ref:
        type: string
        required: true
      tool_ref:
        type: string
        required: true

jobs:
  update-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      BRANCH: ${{ inputs.branch }}
      BRANCH_HEAD_SHA: ${{ inputs.head_sha }}
      BASE_REF: ${{ inputs.base_ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    defaults:
      run:
        working-directory: target
    steps:
      - name: Validate current private PR
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p target
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > pr.json
          jq -e --arg repo "$GH_REPO" --arg head "$BRANCH_HEAD_SHA" --arg branch "$BRANCH" --arg base "$BASE_REF" '.state == "open" and .head.repo.full_name == $repo and .head.sha == $head and .head.ref == $branch and .base.ref == $base' pr.json > /dev/null
      - name: Transition labels
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Keep changes in draft until verification and review
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --json isDraft --jq .isDraft)" != "true" ]; then
            gh pr ready "$PR_NUMBER" --undo
          fi

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Prepare branch
        run: |
          set -euo pipefail
          git -c credential.helper= -c credential.helper='!f() { if [ "$1" = get ]; then printf "username=x-access-token\\npassword=%s\\n" "$GH_TOKEN"; fi; }; f' fetch origin "$BASE_REF"
          git branch --force main FETCH_HEAD
          git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Checkout Sandcastle
        uses: actions/checkout@v4
        with:
          repository: xfocus3/sandcastle
          ref: ${{ inputs.tool_ref }}
          path: sandcastle-tool
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: sandcastle-tool
        run: npm ci

      - name: Build
        working-directory: sandcastle-tool
        run: npm run build

      - name: Run update-branch agent
        id: run
        env:
          OUTPUT_DIR: ${{ runner.temp }}
        uses: actions/github-script@v7
        with:
          script: |
            const { spawn } = require('node:child_process');
            await new Promise((resolve, reject) => {
              const child = spawn(process.execPath, ['../sandcastle-tool/node_modules/tsx/dist/cli.mjs', '../sandcastle-tool/scripts/dot/stage.ts', '.sandcastle/agent-workflows/update-branch/update-branch.ts'], { cwd: process.env.GITHUB_WORKSPACE + '/target', stdio: 'inherit', env: process.env });
              child.on('error', reject);
              child.on('close', code => code === 0 ? resolve() : reject(new Error('Agent stage exited with code ' + code)));
            });

      - name: Push branch (abort cleanly if non-fast-forward)
        if: success()
        env:
          SHOULD_PUSH_FILE: ${{ runner.temp }}/should_push.txt
        run: |
          if [ ! -f "$SHOULD_PUSH_FILE" ] || [ "$(cat "$SHOULD_PUSH_FILE")" != "true" ]; then
            echo "Nothing to push."
            exit 0
          fi
          # Lease against the SHA we checked out — fails if anything pushed
          # to the branch during our run (race detection), and tolerates
          # history-rewriting updates (rebase) when the remote is unchanged.
          set +e
          git -c credential.helper= -c credential.helper='!f() { if [ "$1" = get ]; then printf "username=x-access-token\\npassword=%s\\n" "$GH_TOKEN"; fi; }; f' push origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during update-branch run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Post PR comment
        if: success()
        env:
          COMMENT_FILE: ${{ runner.temp }}/comment.md
        run: |
          if [ -f "$COMMENT_FILE" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
          fi

      - name: Queue verification and review
        if: success()
        run: gh pr edit "$PR_NUMBER" --add-label "agent:review"

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:update-branch` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:update-branch` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
