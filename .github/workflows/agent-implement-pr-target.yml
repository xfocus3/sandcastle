name: Agent implement-pr Target
on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
      branch:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      base_ref:
        type: string
        required: true
      tool_ref:
        type: string
        required: true

jobs:
  implement-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-mutate-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: write

    env:
      BASE_REF: ${{ inputs.base_ref }}
      PR_NUMBER: ${{ inputs.pr_number }}
      BRANCH: ${{ inputs.branch }}
      BRANCH_HEAD_SHA: ${{ inputs.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    defaults:
      run:
        working-directory: target
    steps:
      - name: Validate current private PR
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p target
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > pr.json
          jq -e --arg repo "$GH_REPO" --arg head "$BRANCH_HEAD_SHA" --arg branch "$BRANCH" --arg base "$BASE_REF" '.state == "open" and .head.repo.full_name == $repo and .head.sha == $head and .head.ref == $branch and .base.ref == $base' pr.json > /dev/null
      - name: Transition labels
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Prepare branch
        run: |
          set -euo pipefail
          git -c credential.helper= -c credential.helper='!f() { if [ "$1" = get ]; then printf "username=x-access-token\\npassword=%s\\n" "$GH_TOKEN"; fi; }; f' fetch origin "$BASE_REF"
          git branch --force main FETCH_HEAD
          git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Checkout Sandcastle
        uses: actions/checkout@v4
        with:
          repository: xfocus3/sandcastle
          ref: ${{ inputs.tool_ref }}
          path: sandcastle-tool
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: sandcastle-tool
        run: npm ci

      - name: Build
        working-directory: sandcastle-tool
        run: npm run build

      - name: Run implement-PR agent
        env:
          OUTPUT_DIR: ${{ runner.temp }}
        uses: actions/github-script@v7
        with:
          script: |
            const { spawn } = require('node:child_process');
            await new Promise((resolve, reject) => {
              const child = spawn(process.execPath, ['../sandcastle-tool/node_modules/tsx/dist/cli.mjs', '../sandcastle-tool/scripts/dot/stage.ts', '.sandcastle/agent-workflows/implement-pr/implement-pr.ts'], { cwd: process.env.GITHUB_WORKSPACE + '/target', stdio: 'inherit', env: process.env });
              child.on('error', reject);
              child.on('close', code => code === 0 ? resolve() : reject(new Error('Agent stage exited with code ' + code)));
            });

      - name: Push branch
        if: success()
        run: |
          if [ "$(cat "${RUNNER_TEMP}/has_commits.txt")" != "true" ]; then
            echo "No commits to push."
            exit 0
          fi
          set +e
          git -c credential.helper= -c credential.helper='!f() { if [ "$1" = get ]; then printf "username=x-access-token\\npassword=%s\\n" "$GH_TOKEN"; fi; }; f' push origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during implement-PR run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Post thread replies
        if: success()
        env:
          REPLIES: ${{ runner.temp }}/implement_thread_replies.json
        run: |
          count=$(jq 'length' "$REPLIES")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            commentId=$(jq -r ".[$i].commentId" "$REPLIES")
            body=$(jq -r ".[$i].body" "$REPLIES")
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -F id="$commentId" --jq '.data.node.databaseId')
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId; skipping" >&2
              continue
            fi
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" -f body="$body"
          done

      - name: Post inline comments
        if: success()
        env:
          COMMENTS: ${{ runner.temp }}/implement_new_inline_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          head_sha=$(git rev-parse HEAD)
          for i in $(seq 0 $((count - 1))); do
            path=$(jq -r ".[$i].path" "$COMMENTS")
            line=$(jq -r ".[$i].line" "$COMMENTS")
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments" \
              -f commit_id="$head_sha" \
              -f path="$path" \
              -F line="$line" \
              -f side="RIGHT" \
              -f body="$body"
          done

      - name: Post top-level comments
        if: success()
        env:
          COMMENTS: ${{ runner.temp }}/implement_top_level_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh pr comment "$PR_NUMBER" --body "$body"
          done

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:implement` PR run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
